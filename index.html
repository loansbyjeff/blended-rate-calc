<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blended Rate Debt Calculator</title>
    <style>
        :root {
            --bg-dark: #0F172A;
            --panel-bg: #1E293B;
            --accent-green: #10B981;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --result-dark: #020617;
            --error-red: #EF4444;
            --error-bg: #7F1D1D;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .responsive-wrapper {
            width: 100%;
            max-width: 450px;
            background: #111827;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            margin: 32px 16px;
            box-sizing: border-box;
            border: 1px solid #1F2937;
        }

        .app-container {
            padding: 28px;
            display: flex;
            flex-direction: column;
        }

        .branding-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .brand-main {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .brand-sub {
            font-size: 11px;
            font-weight: bold;
            color: var(--accent-green);
            letter-spacing: 5px;
            margin: 4px 0 0 0;
            text-indent: 5px;
        }

        .app-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent-green);
            text-align: center;
            margin: 0 0 24px 0;
        }

        #debtContainer {
            margin-bottom: 16px;
        }

        .debt-row {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #334155;
            display: grid;
            grid-template-columns: 1.2fr 1fr 0.8fr auto;
            gap: 10px;
            align-items: center;
        }
